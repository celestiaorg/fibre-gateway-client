[package]
name = "fibre-gateway-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Receipt types, commitment verification and an optional HTTP client for the Fibre gateway"
readme = "README.md"
keywords = ["celestia", "fibre", "data-availability"]
categories = ["api-bindings", "cryptography"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rsema1d = "1.3.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
# Async HTTP client.
http = ["dep:reqwest", "dep:bytes", "dep:tokio", "dep:serde_json"]

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "put_verify_get"
required-features = ["http"]
test = true

[[example]]
name = "quickstart"
required-features = ["http"]

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
